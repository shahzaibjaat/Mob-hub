<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobi Hub - All Phones</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial}
body{background:#f2f2f2}
header{background:#000; color:#fff; padding:12px; display:flex; justify-content:space-between; align-items:center}
header h1{font-size:20px}
header a{color:#fff; text-decoration:none; margin-left:12px; background:#222; padding:6px 10px; border-radius:6px}
.hero{background:#fff; padding:15px; text-align:center; margin:10px; border-radius:12px}
.phones{display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; padding:12px}
@media(min-width:600px){ .phones{grid-template-columns: repeat(4, 1fr)} }
.card{background:#fff; border-radius:12px; padding:10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card img{width:100%; height:150px; object-fit:contain}
.card h3{font-size:14px; margin:6px 0}
.card .price{color:green; font-weight:bold}
.card button{width:100%; margin-top:6px; padding:8px; background:#000; color:#fff; border:none; border-radius:8px}
.tabs{display:flex; justify-content:center; gap:10px; margin:12px}
.tabs button{padding:10px 18px; border:none; border-radius:20px; background:#ddd; cursor:pointer}
.tabs button.active{background:#000; color:#fff}
.demand-section{background:#fff; margin:12px; padding:15px; border-radius:12px; display:none}
.demand-section.active{display:block}
.demand-section input, .demand-section textarea{width:100%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:8px}
.demand-section .btn{background:green; color:#fff; padding:12px; border:none; width:100%; border-radius:8px; font-size:16px}
.demand-list{margin-top:15px}
.demand-item{background:#f9f9f9; padding:10px; border-radius:8px; margin:6px 0; border-left:4px solid green}
</style>
</head>
<body>

<header>
  <h1>MOBI HUB</h1>
  <div>
    <a href="#" onclick="showTab('phones')">All Phones</a>
    <a href="#" onclick="showTab('demand')">Demand</a>
  </div>
</header>

<div class="hero">
  <h2 id="tabTitle">All Phones - Sare Models</h2>
</div>

<div class="tabs">
  <button id="btn-phones" class="active" onclick="showTab('phones')">📱 All Phones</button>
  <button id="btn-demand" onclick="showTab('demand')">🔍 Demand List</button>
</div>

<!-- ALL PHONES SECTION -->
<div id="phonesSection" class="phones"></div>

<!-- DEMAND SECTION -->
<div id="demandSection" class="demand-section">
  <h3>Phone Nahi Mila? Demand Bhejo</h3>
  <input type="text" id="cName" placeholder="Apka Naam">
  <input type="text" id="cMobile" placeholder="WhatsApp Number">
  <input type="text" id="cModel" placeholder="Kaunsa Phone Chahiye? Ex: iPhone 13">
  <input type="text" id="cBudget" placeholder="Budget? Ex: 60000">
  <button class="btn" onclick="saveDemand()">Demand Bhejo</button>

  <div class="demand-list">
    <h3 style="margin-top:20px">📋 Sari Demands (Yahan Ayengi)</h3>
    <div id="demandList"></div>
  </div>
</div>

<script>
// --- YAHAN SARE PHONES ADD KARO - JITNE MARZI - 6 KI LIMIT KHATAM ---
const allPhones = [
  {name:"iPhone 14 Pro Max", price:"285000", img:"https://via.placeholder.com/200?text=iPhone+14+Pro"},
  {name:"Samsung S23 Ultra", price:"245000", img:"https://via.placeholder.com/200?text=S23+Ultra"},
  {name:"Infinix Hot 40", price:"35000", img:"https://via.placeholder.com/200?text=Hot+40"},
  {name:"Tecno Spark 20", price:"32000", img:"https://via.placeholder.com/200?text=Spark+20"},
  {name:"Redmi Note 12", price:"45000", img:"https://via.placeholder.com/200?text=Note+12"},
  {name:"Vivo Y17s", price:"38000", img:"https://via.placeholder.com/200?text=Y17s"},
  {name:"iPhone 11", price:"95000", img:"https://via.placeholder.com/200?text=iPhone+11"},
  {name:"Samsung A32", price:"55000", img:"https://via.placeholder.com/200?text=A32"},
  {name:"Realme C53", price:"36000", img:"https://via.placeholder.com/200?text=C53"},
  {name:"iPhone 13", price:"165000", img:"https://via.placeholder.com/200?text=iPhone+13"},
  {name:"Samsung A54", price:"85000", img:"https://via.placeholder.com/200?text=A54"},
  {name:"Oppo A78", price:"62000", img:"https://via.placeholder.com/200?text=A78"},
  // Yahan aur phones add karte jao, koi limit nahi
];

function loadPhones(){
  let html = "";
  allPhones.forEach(p => {
    html += `<div class="card">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div class="price">Rs. ${p.price}</div>
      <button>View Details</button>
    </div>`;
  });
  document.getElementById("phonesSection").innerHTML = html;
}

function showTab(type){
  if(type === 'phones'){
    document.getElementById("phonesSection").style.display = "grid";
    document.getElementById("demandSection").classList.remove("active");
    document.getElementById("btn-phones").classList.add("active");
    document.getElementById("btn-demand").classList.remove("active");
    document.getElementById("tabTitle").innerText = "All Phones - Sare Models ("+allPhones.length+")";
  } else {
    document.getElementById("phonesSection").style.display = "none";
    document.getElementById("demandSection").classList.add("active");
    document.getElementById("btn-demand").classList.add("active");
    document.getElementById("btn-phones").classList.remove("active");
    document.getElementById("tabTitle").innerText = "Customer Demands";
    showDemands();
  }
}

function saveDemand(){
  const name = document.getElementById("cName").value;
  const mobile = document.getElementById("cMobile").value;
  const model = document.getElementById("cModel").value;
  const budget = document.getElementById("cBudget").value;
  if(!name || !mobile || !model){ alert("Naam, Mobile aur Model likhna zaruri hai"); return; }
  
  let demands = JSON.parse(localStorage.getItem("mobiDemands") || "[]");
  demands.push({name, mobile, model, budget, date: new Date().toLocaleString()});
  localStorage.setItem("mobiDemands", JSON.stringify(demands));
  alert("Demand Save Ho Gayi!");
  document.getElementById("cName").value = "";
  document.getElementById("cMobile").value = "";
  document.getElementById("cModel").value = "";
  document.getElementById("cBudget").value = "";
  showDemands();
}

function showDemands(){
  let demands = JSON.parse(localStorage.getItem("mobiDemands") || "[]");
  let html = "";
  if(demands.length === 0) html = "<p>Abhi koi demand nahi hai</p>";
  demands.reverse().forEach(d => {
    html += `<div class="demand-item">
      <b>${d.name}</b> - ${d.mobile}<br>
      Model: ${d.model} | Budget: ${d.budget}<br>
      <small>${d.date}</small> - <a href="https://wa.me/${d.mobile}" target="_blank">WhatsApp Karo</a>
    </div>`;
  });
  document.getElementById("demandList").innerHTML = html;
}

loadPhones();
</script>

</body>
</html>
