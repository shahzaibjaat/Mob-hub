<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobi-Hub.Pk - Unlimited Storage v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{font-family:'Poppins',sans-serif; background:#f8fdf9;}
.pti-green{background:#0a5c36;}
</style>
</head>
<body>
<nav class="pti-green text-white p-3 flex justify-between">
<div class="font-bold">Mobi-Hub.Pk - UNLIMITED v3.0</div>
<button onclick="showPage('admin')" class="bg-red-600 px-3 py-1 rounded-full text-xs">Admin - <span id="totalPhoneCount">0</span> Phones</button>
</nav>

<div id="admin" class="max-w-6xl mx-auto p-4">
<h2 class="text-xl font-bold text-green-800">Admin Panel - Unlimited Storage (IndexedDB)</h2>
<div class="mt-2 bg-green-100 border-2 border-green-600 p-3 rounded-xl text-xs">
<b>✓ FIXED:</b> Ab localStorage nahi, IndexedDB use ho raha hai. 500+ Phones! 
Storage Used: <span id="storageUsed">0</span> | 
<button onclick="clearOldStorage()" class="bg-yellow-200 px-2 py-1 rounded-full">1-Click Purana Storage Clear Karo (Is error ko khatam karne ke liye)</button>
<button onclick="resetToDefault()" class="bg-red-100 text-red-700 px-2 py-1 rounded-full ml-1">Reset</button>
</div>

<div class="mt-4 bg-white p-4 rounded-xl shadow border-2 border-green-600">
<h3 class="font-bold">+ Add New Phone - Auto Compress to 80KB</h3>
<div class="grid grid-cols-3 gap-2 mt-3">
<input id="newPhoneName" placeholder="Model" class="border rounded px-2 py-2 text-sm">
<input id="newPhoneBrand" placeholder="Brand" class="border rounded px-2 py-2 text-sm">
<input id="newPhonePrice" placeholder="Price" type="number" class="border rounded px-2 py-2 text-sm">
<input id="newPhoneRam" placeholder="RAM" class="border rounded px-2 py-2 text-sm">
<input id="newPhoneStorage" placeholder="Storage" class="border rounded px-2 py-2 text-sm">
<input id="newPhoneCamera" placeholder="Camera" class="border rounded px-2 py-2 text-sm">
</div>
<div class="mt-3 border-2 border-dashed p-3 bg-green-50 rounded-xl">
<input type="file" id="newPhoneImage" accept="image/*" class="text-xs">
<img id="imagePreview" class="w-20 h-20 object-contain bg-white border mt-2 hidden">
<p id="compressInfo" class="text-[10px] text-green-700 mt-1"></p>
</div>
<div id="addPreview" class="mt-2 text-xs text-gray-600"></div>
<button onclick="addNewPhoneFull()" class="mt-3 w-full pti-green text-white py-3 rounded-full font-bold">Add Phone - Unlimited Save</button>
</div>

<div class="mt-6 bg-white p-4 rounded-xl shadow border">
<h3 class="font-bold">All Phones - <span id="adminCount">0</span></h3>
<div id="adminPhoneList" class="mt-3 grid md:grid-cols-2 gap-3"></div>
</div>
</div>

<script>
let defaultPhones=[
{n:"iPhone 15 Pro (128GB)",b:"Apple",p:"PKR 359,999",price:359999,ram:"8GB",storage:"128GB",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",specs:{Camera:"48MP"}},
{n:"Samsung S24 Ultra",b:"Samsung",p:"PKR 289,999",price:289999,ram:"12GB",storage:"256GB",img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400",specs:{Camera:"200MP"}},
{n:"Infinix Note 40 Pro",b:"Infinix",p:"PKR 64,999",price:64999,ram:"12GB",storage:"256GB",img:"https://images.unsplash.com/photo-1585060544812-6b45742d762f?w=400",specs:{Camera:"108MP"}},
{n:"Tecno Camon 30",b:"Tecno",p:"PKR 78,999",price:78999,ram:"12GB",storage:"256GB",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",specs:{Camera:"50MP"}}
];
let phones=[], tempImageData="";
let db;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('MobiHubDB_v3',1);
    req.onupgradeneeded=e=>{ e.target.result.createObjectStore('phones',{keyPath:'id',autoIncrement:true}); };
    req.onsuccess=e=>{ db=e.target.result; res(db); };
    req.onerror=e=>rej(e);
  });
}
async function saveToDB(){
  const tx=db.transaction('phones','readwrite');
  const store=tx.objectStore('phones');
  await store.clear();
  for(let p of phones){ await store.add(p); }
  updateInfo();
}
async function loadFromDB(){
  await openDB();
  return new Promise((res)=>{
    const tx=db.transaction('phones','readonly');
    const store=tx.objectStore('phones');
    const req=store.getAll();
    req.onsuccess=()=>{
      if(req.result.length>0){ phones=req.result; }
      else{ phones=[...defaultPhones]; saveToDB(); }
      renderAdminList(); updateInfo(); res();
    };
  });
}
function compressImage(file, callback){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width, h=img.height;
      if(w>600){ h=Math.round(h*600/w); w=600; }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.5));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearOldStorage(){
  localStorage.removeItem('mobiHubPhones');
  localStorage.removeItem('mobiHubReceiptRequests');
  alert('✓ Purana 5MB wala storage clear ho gaya! Ab 500+ phones add honge. Page reload ho raha hai.');
  location.reload();
}
function resetToDefault(){ if(confirm('Reset?')){ phones=[...defaultPhones]; saveToDB().then(()=>renderAdminList()); }}

document.getElementById('newPhoneImage').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  compressImage(file, data=>{
    tempImageData=data;
    document.getElementById('imagePreview').src=data;
    document.getElementById('imagePreview').classList.remove('hidden');
    document.getElementById('compressInfo').innerText='✓ Compressed: '+Math.round(data.length/1024)+'KB (Original: '+Math.round(file.size/1024)+'KB) - Ab save hoga!';
    updateAddPreview();
  });
});
function updateAddPreview(){
  const name=document.getElementById('newPhoneName').value||'Model';
  document.getElementById('addPreview').innerText=name+' - Ready '+ (tempImageData?Math.round(tempImageData.length/1024)+'KB':'');
}
['newPhoneName'].forEach(id=>document.getElementById(id).addEventListener('input', updateAddPreview));

async function addNewPhoneFull(){
  const name=document.getElementById('newPhoneName').value;
  const brand=document.getElementById('newPhoneBrand').value||'Other';
  const priceVal=document.getElementById('newPhonePrice').value;
  const ram=document.getElementById('newPhoneRam').value||'8GB';
  const storage=document.getElementById('newPhoneStorage').value||'128GB';
  const camera=document.getElementById('newPhoneCamera').value||'50MP';
  if(!name||!priceVal||!tempImageData){alert('Name, Price, Picture zaroori'); return;}
  const priceNum=parseInt(priceVal);
  phones.push({n:name,b:brand,p:"PKR "+priceNum.toLocaleString(),price:priceNum,ram:ram,storage:storage,img:tempImageData,specs:{Camera:camera}});
  await saveToDB();
  alert('✓ Add Hogaya! Total: '+phones.length);
  document.getElementById('newPhoneName').value=''; document.getElementById('newPhonePrice').value=''; document.getElementById('newPhoneImage').value=''; document.getElementById('imagePreview').classList.add('hidden'); tempImageData='';
  renderAdminList();
}
function renderAdminList(){
  const list=document.getElementById('adminPhoneList'); list.innerHTML='';
  phones.forEach((ph,idx)=>{
    list.innerHTML+=`<div class="border p-2 rounded flex gap-2 bg-white"><img src="${ph.img}" class="w-16 h-16 object-contain bg-gray-50 border"><div class="flex-1"><p class="font-bold text-xs">${ph.n}</p><p class="text-[10px]">${ph.b} - ${ph.p}</p><button onclick="removePhone(${idx})" class="mt-1 text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded-full">Remove</button></div></div>`;
  });
  updateInfo();
}
async function removePhone(idx){ if(!confirm('Remove '+phones[idx].n)) return; phones.splice(idx,1); await saveToDB(); renderAdminList(); }
function updateInfo(){ document.getElementById('totalPhoneCount').innerText=phones.length; document.getElementById('adminCount').innerText=phones.length; let total=Math.round(JSON.stringify(phones).length/1024); document.getElementById('storageUsed').innerText=total+'KB / Unlimited (50MB+)'; }
function showPage(){}
loadFromDB();
</script>
</body>
</html>
